name: Check

# Runs on every pull request and every change to main.
# Pull requests from forks run with read-only access: they can't change this repository.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned: Playwright 1.56 has no browser build for newer Ubuntu releases.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Built website matches the source
        run: python3 tools/build.py --check

      - name: Content is valid and nothing was removed
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then base="origin/$BASE_REF";
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then base="$BEFORE";
          else base="HEAD~1"; fi
          node tests/validate.js --base "$base"

      - name: Install test browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Browser tests
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          node tests/browser.js http://localhost:8765/
